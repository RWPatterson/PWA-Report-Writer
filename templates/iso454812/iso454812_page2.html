<!-- =====================================================================================
     iso454812_page2.html — ISO 4548-12:2017, Table B.2 (per-bucket filtration
     efficiency). NOT a single rendered page — a REPEATABLE page PROTOTYPE: an inert
     <template> holding ONE fully-shaped B.2 sheet (title, identification header, and
     the results table with all 5 CLUMPS_PER_PAGE slots and all 16 possible size
     columns already present as real cells), plus an anchor marker. reportView.js's
     fillTableB2Pages clones this once per group of 5 real clumps and inserts the
     filled copies after the anchor — a 3-clump test makes one sheet (with slots 4-5
     hidden), a 14-clump test makes three (the last with slots 4-5 hidden).

     A test's clump COUNT is genuinely unbounded (scales with test duration), so some
     repeating-PAGE mechanism stays necessary — but each page's own INTERNAL shape is
     now fully static, not built at render time: 5 clump slots (data-clump-slot="1"
     .."5"), each with its meta row and two 8-wide size blocks (data-block="1"/"2" x
     data-field="size"/"upstream"/"downstream"/"efficiency"), all 16 .b2-size-col
     cells per block-pair already in the markup. reportView.js's fillTableB2Pages only
     ever sets .textContent on a cell that already exists and toggles rpt-slot-hidden
     (app.css) on: a size column past however many are actually selected (same
     mechanism as ISO16889 Page 2's .w16889-size-col), or — new here — an ENTIRE
     clump-slot tbody past however many real clumps remain on this page's last sheet.
     Never creates, appends, or removes a row/cell.

     Why a real per-page template instead of the old one-giant-table-with-repeating-
     <thead> approach: the giant table relied on the browser's natural flow to decide
     where each page broke, which meant the last clump on a page could spill or get
     orphaned when the print typography changed. Explicit N-clumps-per-page pages give
     predictable, self-contained sheets: each carries its own identification header,
     and pagination is just ".report-page { page-break-after: always }" (app.css)
     between whole pages — no dependence on where a shared table happens to break.

     <template> content is inert: its [data-slot] fields are NOT matched by
     fillTemplate's container-wide querySelectorAll (template content lives in a
     separate document fragment), so the prototype never gets filled or mangled in
     place — only its clones do, each via fillTableB2Pages' own fillSlots call. -->
